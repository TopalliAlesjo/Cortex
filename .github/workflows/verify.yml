name: Cortex native verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm install --global npm@11.20.0
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Configure Linux Chromium sandbox
        if: runner.os == 'Linux'
        shell: bash
        run: |
          browser_cache="${PLAYWRIGHT_BROWSERS_PATH:-$HOME/.cache/ms-playwright}"
          profile="$RUNNER_TEMP/cortex-playwright.apparmor"
          printf 'abi <abi/4.0>,\ninclude <tunables/global>\n' > "$profile"
          count=0
          while IFS= read -r -d '' executable; do
            count=$((count + 1))
            printf '\nprofile cortex-playwright-ci-%s "%s" flags=(unconfined) {\n  userns,\n}\n' \
              "$count" "$executable" >> "$profile"
          done < <(find "$browser_cache" -type f -executable \( -name chrome -o -name chrome-headless-shell \) -print0)
          if [[ "$count" == 0 ]]; then
            echo "No Playwright Chromium executable found for the AppArmor profile." >&2
            exit 1
          fi
          sudo install -m 0644 "$profile" /etc/apparmor.d/cortex-playwright-ci
          sudo apparmor_parser --replace /etc/apparmor.d/cortex-playwright-ci
      - name: Check Chromium startup with sandbox
        run: node test/browser-startup.mjs
      - run: npm run test:verify
