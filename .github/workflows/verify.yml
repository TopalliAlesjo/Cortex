name: Cortex native verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm install --global npm@11.20.0
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Configure Linux Chromium sandbox
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sandbox=/opt/google/chrome/chrome-sandbox
          if [[ ! -u "$sandbox" || "$(stat -c %u "$sandbox")" != 0 ]]; then
            echo "The runner must provide a root-owned setuid Chrome sandbox helper." >&2
            exit 1
          fi
          echo "CHROME_DEVEL_SANDBOX=$sandbox" >> "$GITHUB_ENV"
      - name: Check Chromium startup with sandbox
        run: node test/browser-startup.mjs
      - run: npm run test:verify
